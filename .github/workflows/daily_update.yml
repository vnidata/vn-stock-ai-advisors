name: Daily Stock AI Advisors Update

on:
  schedule:
    # Quét và cập nhật tự động mỗi 5 phút trong phiên giao dịch từ Thứ Hai đến Thứ Sáu (Giờ Việt Nam UTC+7):
    # 02:00 - 08:55 UTC tương ứng 09:00 - 15:55 VN Time (UTC+7)
    - cron: '*/5 2-8 * * 1-5'
  workflow_dispatch: # Allows manual trigger from GitHub UI

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  update-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          # Attempt vnstock installation from custom index (optional, non-blocking if blocked by datacenter firewall)
          pip install --extra-index-url https://vnstocks.com/api/simple --trusted-host vnstocks.com vnstock || echo "::warning::vnstock custom package index is unreachable from CI runner IP. Proceeding with cache & direct feeds."


      - name: Run Daily Data Ingestion & Advisor Inference
        run: |
          python scripts/daily_update.py

      - name: Commit and Push Updated Data
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add docs/data/ data/cache/ data/portfolio_holdings.json news/news_cache.json
          if git diff --staged --quiet; then
            echo "No daily data changes to commit."
          else
            git commit -m "Auto-update daily advisor portfolio recommendations [skip ci]"
            git push
          fi
