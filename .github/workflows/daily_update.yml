name: Daily Stock AI Advisors Update

on:
  schedule:
    # Runs Monday to Friday at 09:30 UTC (16:30 Vietnam Time, 1.5 hours after HOSE close)
    - cron: '30 9 * * 1-5'
  workflow_dispatch: # Allows manual trigger from GitHub UI

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  update-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Daily Data Ingestion & Advisor Inference
        run: |
          python scripts/daily_update.py

      - name: Commit and Push Updated Data
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add docs/data/
          if git diff --staged --quiet; then
            echo "No daily data changes to commit."
          else
            git commit -m "Auto-update daily advisor portfolio recommendations [skip ci]"
            git push
          fi
