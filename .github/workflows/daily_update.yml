name: Daily Stock AI Advisors Update

on:
  schedule:
    # 6 phiên quét tự động mỗi ngày giao dịch từ Thứ Hai đến Thứ Sáu (Giờ Việt Nam UTC+7):
    - cron: '0 2 * * 1-5'    # 09:00 VN Time - Mở phiên ATO & Khởi động sáng
    - cron: '0 3 * * 1-5'    # 10:00 VN Time - Giữa phiên sáng, dòng tiền ổn định
    - cron: '30 4 * * 1-5'   # 11:30 VN Time - Chốt phiên sáng, đánh giá xu hướng trưa
    - cron: '30 6 * * 1-5'   # 13:30 VN Time - Đầu phiên chiều, hấp thụ lượng hàng về
    - cron: '0 7 * * 1-5'    # 14:00 VN Time - Giờ cao điểm phiên chiều, rung lắc mạnh
    - cron: '0 8 * * 1-5'    # 15:00 VN Time - Đóng phiên ATC & Tổng kết ngày
  workflow_dispatch: # Allows manual trigger from GitHub UI

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  update-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          # Attempt vnstock installation from custom index (optional, non-blocking if blocked by datacenter firewall)
          pip install --extra-index-url https://vnstocks.com/api/simple --trusted-host vnstocks.com vnstock || echo "::warning::vnstock custom package index is unreachable from CI runner IP. Proceeding with cache & direct feeds."


      - name: Run Daily Data Ingestion & Advisor Inference
        run: |
          python scripts/daily_update.py

      - name: Commit and Push Updated Data
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add docs/data/ data/cache/ news/news_cache.json
          if git diff --staged --quiet; then
            echo "No daily data changes to commit."
          else
            git commit -m "Auto-update daily advisor portfolio recommendations [skip ci]"
            git push
          fi
